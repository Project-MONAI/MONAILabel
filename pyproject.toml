[project]
name = "monailabel-workspace"
version = "1.0.0rc1"
description = "Assistants for annotation and model learning"
requires-python = ">=3.12"
dependencies = ["monailabel==1.0.0rc1"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
monailabel = { workspace = true }
monailabel-sam-runtime = { workspace = true }
monailabel-monai = { workspace = true }
monailabel-sam = { workspace = true }
monailabel-nninteractive = { workspace = true }
monailabel-totalsegmentator = { workspace = true }
monailabel-dicom = { workspace = true }
monailabel-core = { workspace = true }
monailabel-providers = { workspace = true }
monailabel-server = { workspace = true }
monailabel-client = { workspace = true }
monailabel-viewers = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.11",
    "mypy>=1.15",
    "httpx>=0.28",
    "httpx2>=2.13.0",
    "pre-commit>=4.6.2",
    "isort>=9.0.1",
    "pre-commit-hooks>=6.0.0",
    "types-pyyaml>=6.0.12.20260906",
    "shellcheck-py>=0.11.0.1",
]
e2e = [
    "playwright==1.63.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "browser_e2e: workspace browser workflows against a disposable server",
    "video_e2e: browser workflow against disposable CVAT services",
    "desktop_e2e: real Slicer and QuPath streamed into a browser using disposable containers",
]
filterwarnings = [
  "error",
  # Report device capability warnings without preventing execution checks.
  'default:\s*Found GPU\d+ NVIDIA GB10 which is of cuda capability 12\.1\.:UserWarning:torch.cuda',
  # MONAI 1.5.2 uses list indexing in its sliding-window utility.
  "ignore:Using a non-tuple sequence for multidimensional indexing is deprecated.*:UserWarning:monai.inferers.utils",
  # MONAI imports its DINTS TorchScript interface, deprecated in Torch 2.11.
  'ignore:`torch.jit.interface` is deprecated.*:DeprecationWarning:torch.jit._script',
  # SAM 2.1 scripts its image transforms; Torch 2.11 deprecates this entry point.
  'ignore:`torch.jit.script` is deprecated.*:DeprecationWarning:torch.jit._script',
  # The pinned SAM runtime uses this Torch context; real tracking is checked in video E2E.
  "ignore:.*torch.backends.cuda.sdp_kernel.*deprecated.*:FutureWarning",
  # Starlette 1.6 still imports this compatibility alias from AnyIO.
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["packages/sam-runtime/src"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true
extend_skip = ["packages/sam-runtime/src"]
known_third_party = ["monai"]
known_first_party = ["monailabel.core", "monailabel.providers", "monailabel.server", "monailabel.client", "monailabel.viewers", "monailabel.monai", "monailabel.dicom", "monailabel.sam", "monailabel.totalsegmentator", "monailabel.nninteractive"]

[tool.ruff.lint.isort]
known-third-party = ["monai"]
known-first-party = ["monailabel.core", "monailabel.providers", "monailabel.server", "monailabel.client", "monailabel.viewers", "monailabel.monai", "monailabel.dicom", "monailabel.sam", "monailabel.totalsegmentator", "monailabel.nninteractive"]

[tool.mypy]
python_version = "3.12"
strict = true
namespace_packages = true
explicit_package_bases = true
mypy_path = ["$MYPY_CONFIG_FILE_DIR/packages/monailabel/src", "$MYPY_CONFIG_FILE_DIR/packages/core/src", "$MYPY_CONFIG_FILE_DIR/packages/providers/src", "$MYPY_CONFIG_FILE_DIR/packages/server/src", "$MYPY_CONFIG_FILE_DIR/packages/client/src", "$MYPY_CONFIG_FILE_DIR/packages/viewers/src", "$MYPY_CONFIG_FILE_DIR/packages/monai/src", "$MYPY_CONFIG_FILE_DIR/packages/sam/src", "$MYPY_CONFIG_FILE_DIR/packages/dicom/src", "$MYPY_CONFIG_FILE_DIR/packages/totalsegmentator/src", "$MYPY_CONFIG_FILE_DIR/packages/nninteractive/src"]
exclude = ["tests", "packages/sam-runtime/src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["nibabel.*", "sam2.*", "totalsegmentator.*", "nnunetv2.*", "nnInteractive.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["monailabel.viewers.resources.slicer_bridge", "monailabel.viewers.resources.spatial_hints"]
ignore_errors = true

[tool.coverage.run]
source = ["monailabel.core", "monailabel.providers", "monailabel.server", "monailabel.client"]
