[project]
name = "monailabel-workspace"
version = "0.1.0"
description = "Assistants for annotation and model learning"
requires-python = ">=3.12"
dependencies = ["monailabel-server", "monailabel-client"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
monailabel-monai = { workspace = true }
monailabel-sam = { workspace = true }
monailabel-dicom = { workspace = true }
monailabel-core = { workspace = true }
monailabel-providers = { workspace = true }
monailabel-server = { workspace = true }
monailabel-client = { workspace = true }
monailabel-viewers = { workspace = true }
torch = { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" }
torchvision = { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.11",
    "mypy>=1.15",
    "httpx>=0.28",
    "httpx2>=2.13.0",
    "pre-commit>=4.6.2",
    "isort>=9.0.1",
    "pre-commit-hooks>=6.0.0",
    "types-pyyaml>=6.0.12.20260906",
    "shellcheck-py>=0.11.0.1",
]
e2e = [
    "playwright==1.63.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "browser_e2e: workspace browser workflows against a disposable server",
    "video_e2e: browser workflow against disposable CVAT services",
    "desktop_e2e: real Slicer and QuPath streamed into a browser using disposable containers",
]
filterwarnings = [
  "error",
  # MONAI 1.5.2 uses list indexing in its sliding-window utility; checked with Torch 2.10.
  "ignore:Using a non-tuple sequence for multidimensional indexing is deprecated.*:UserWarning:monai.inferers.utils",
  # The pinned SAM runtime uses this Torch context; real tracking is checked in video E2E.
  "ignore:.*torch.backends.cuda.sdp_kernel.*deprecated.*:FutureWarning",
  # Starlette 1.6 still imports this compatibility alias from AnyIO.
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true
known_third_party = ["monai"]
known_first_party = ["monailabel.core", "monailabel.providers", "monailabel.server", "monailabel.client", "monailabel.viewers", "monailabel.monai", "monailabel.dicom", "monailabel.sam"]

[tool.ruff.lint.isort]
known-third-party = ["monai"]
known-first-party = ["monailabel.core", "monailabel.providers", "monailabel.server", "monailabel.client", "monailabel.viewers", "monailabel.monai", "monailabel.dicom", "monailabel.sam"]

[tool.mypy]
python_version = "3.12"
strict = true
namespace_packages = true
explicit_package_bases = true
mypy_path = ["$MYPY_CONFIG_FILE_DIR/packages/core/src", "$MYPY_CONFIG_FILE_DIR/packages/providers/src", "$MYPY_CONFIG_FILE_DIR/packages/server/src", "$MYPY_CONFIG_FILE_DIR/packages/client/src", "$MYPY_CONFIG_FILE_DIR/packages/viewers/src", "$MYPY_CONFIG_FILE_DIR/packages/monai/src", "$MYPY_CONFIG_FILE_DIR/packages/sam/src", "$MYPY_CONFIG_FILE_DIR/packages/dicom/src"]
exclude = ["tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["nibabel.*", "sam2.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["monailabel.viewers.resources.slicer_bridge", "monailabel.viewers.resources.spatial_hints"]
ignore_errors = true

[tool.coverage.run]
source = ["monailabel.core", "monailabel.providers", "monailabel.server", "monailabel.client"]
