[project]
name = "monailabel-server"
version = "1.0.0rc1"
description = "Annotation assistant service and local workspace"
readme = "README.md"
license = "Apache-2.0 AND MIT"
license-files = ["LICENSE", "src/monailabel/server/static/vendor/LICENSE-markdown-it.txt"]
requires-python = ">=3.12"
dependencies = [
    "monailabel-core==1.0.0rc1",
    "monailabel-providers==1.0.0rc1",
    "monailabel-monai==1.0.0rc1",
    "monailabel-nninteractive==1.0.0rc1",
    "monailabel-sam==1.0.0rc1",
    "monailabel-totalsegmentator==1.0.0rc1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "wsproto>=1.2,<2",
    "nibabel>=5.3,<6",
    "cryptography>=50.0.1",
    "filelock>=3.32.6",
    "monailabel-viewers==1.0.0rc1",
    "monailabel-dicom==1.0.0rc1",
    "python-multipart>=0.0.20,<1",
    "pyyaml>=6,<7",
]

[project.scripts]
monailabel-server = "monailabel.server.main:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.uv.sources]
monailabel-viewers = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/monailabel"]

[project.urls]
Repository = "https://github.com/Project-MONAI/MONAILabel"
Documentation = "https://github.com/Project-MONAI/MONAILabel/blob/1.0/README.md"
