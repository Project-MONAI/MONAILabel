[project]
name = "monailabel-providers"
version = "0.1.0"
description = "Replaceable segmentation and training providers"
requires-python = ">=3.12"
dependencies = ["monailabel-core", "httpx>=0.28,<1", "pillow>=11,<13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/monailabel"]
