[project]
name = "monailabel-client"
version = "0.1.0"
description = "Python client and CLI for annotation assistants"
requires-python = ">=3.12"
dependencies = [
    "monailabel-core",
    "monailabel-viewers",
    "httpx>=0.28,<1",
    "platformdirs>=4.11.8",
]

[project.scripts]
monailabel = "monailabel.client.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/monailabel"]
