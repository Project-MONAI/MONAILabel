[project]
name = "monailabel-core"
version = "1.0.0rc1"
description = "Domain contracts for annotation and learning"
readme = "README.md"
license = "Apache-2.0 AND LicenseRef-Slicer"
license-files = ["LICENSE", "src/monailabel/core/resources/GenericAnatomyColors.LICENSE.txt"]
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3", "numpy>=2,<3"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/monailabel"]

[project.urls]
Repository = "https://github.com/Project-MONAI/MONAILabel"
Documentation = "https://github.com/Project-MONAI/MONAILabel/blob/1.0/README.md"
