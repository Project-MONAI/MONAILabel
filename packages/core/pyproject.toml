[project]
name = "monailabel-core"
version = "0.1.0"
description = "Domain contracts for annotation and learning"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3", "numpy>=2,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/monailabel"]
