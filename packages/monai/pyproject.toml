[project]
name = "monailabel-monai"
version = "0.1.0"
description = "MONAI neural segmentation recipes and inference"
requires-python = ">=3.12"
dependencies = ["monailabel-core", "monailabel-providers", "monai>=1.5.2,<1.6", "torch>=2.8,<2.11", "httpx>=0.28", "filelock>=3", "platformdirs>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/monailabel"]
