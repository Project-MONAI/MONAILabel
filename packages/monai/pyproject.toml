[project]
name = "monailabel-monai"
version = "1.0.0rc1"
description = "MONAI neural segmentation recipes and inference"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["monailabel-core==1.0.0rc1", "monailabel-providers==1.0.0rc1", "monai>=1.5.2,<1.6", "nnunetv2==2.6.4", "torch>=2.11,<2.12", "httpx>=0.28", "filelock>=3", "platformdirs>=4"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/monailabel"]

[project.urls]
Repository = "https://github.com/Project-MONAI/MONAILabel"
Documentation = "https://github.com/Project-MONAI/MONAILabel/blob/1.0/README.md"
