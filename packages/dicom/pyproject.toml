[project]
name = "monailabel-dicom"
version = "0.1.0"
description = "DICOM series geometry and derived research-data conversion"
requires-python = ">=3.12"
dependencies = ["monailabel-core", "numpy>=2,<3", "pydicom>=3.0.2,<4", "httpx>=0.28,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/monailabel"]
