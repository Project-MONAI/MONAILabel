[project]
name = "monailabel"
version = "1.0.0rc1"
description = "MONAI Label image annotation, review and model learning workspace"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12"
dependencies = ["monailabel-server==1.0.0rc1", "monailabel-client==1.0.0rc1"]

[project.scripts]
monailabel = "monailabel.launcher:main"

[project.urls]
Homepage = "https://monai.io/label.html"
Repository = "https://github.com/Project-MONAI/MONAILabel"
Documentation = "https://github.com/Project-MONAI/MONAILabel/blob/1.0/README.md"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/monailabel"]
