[project]
name = "monailabel-viewers"
version = "0.1.0"
description = "Reusable desktop viewer provisioning and thin integrations"
requires-python = ">=3.12"
dependencies = ["monailabel-core", "httpx>=0.28,<1", "filelock>=3.18,<4", "platformdirs>=4,<5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/monailabel"]
