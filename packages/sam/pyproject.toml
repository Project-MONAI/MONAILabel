[project]
name = "monailabel-sam"
version = "1.0.0rc1"
description = "Local SAM image and medical-volume annotation"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "src/monailabel/sam/resources/LICENSE-SAM"]
requires-python = ">=3.12"
dependencies = [
    "monailabel-core==1.0.0rc1",
    "monailabel-providers==1.0.0rc1",
    "monailabel-sam-runtime==1.0.0rc1",
    "torch>=2.5.1",
    "torchvision>=0.20.1",
    "httpx>=0.28,<1",
    "filelock>=3",
    "platformdirs>=4",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/monailabel"]

[project.urls]
Repository = "https://github.com/Project-MONAI/MONAILabel"
Documentation = "https://github.com/Project-MONAI/MONAILabel/blob/1.0/README.md"
