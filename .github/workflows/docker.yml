name: Docker
on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
      tag:
        type: string
        default: dev
      latest:
        type: boolean
        default: false
    secrets:
      DOCKER_PW:
        required: false
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to Docker Hub
        type: boolean
        default: false
      tag:
        description: Image tag
        type: string
        default: dev
      latest:
        description: Also update latest
        type: boolean
        default: false
  pull_request:
    paths: ['Dockerfile', 'compose.yaml', '.dockerignore', 'pyproject.toml', 'uv.lock', 'packages/**', 'scripts/check_*.py', '.github/workflows/docker.yml']
  schedule:
    - cron: '0 2 * * 0'
permissions:
  contents: read
concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      IMAGE: projectmonai/monailabel
      PUBLISH: ${{ github.repository == 'Project-MONAI/MONAILabel' && (inputs.publish || github.event_name == 'schedule') }}
    steps:
      - uses: actions/checkout@v6
      - name: Free space for image build
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - uses: docker/setup-buildx-action@v3
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: docker compose config --quiet
      - name: Read package version
        id: version
        env:
          REQUESTED_LATEST: ${{ inputs.latest }}
        run: |
          python - <<'PY'
          import os, re, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          if os.environ['REQUESTED_LATEST'] == 'true':
              assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version), 'Prereleases cannot update latest'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write(f'version={version}\n')
          PY
      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          username: projectmonai
          password: ${{ secrets.DOCKER_PW }}
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: monailabel:check
          build-args: |
            MONAILABEL_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.arch }}
      - run: python scripts/check_docker.py monailabel:check
      - name: Publish verified architecture
        id: push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: |
            MONAILABEL_VERSION=${{ steps.version.outputs.version }}
          sbom: true
          provenance: mode=max
          outputs: type=image,name=projectmonai/monailabel,push-by-digest=true,name-canonical=true,push=true
      - name: Record digest
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        if: env.PUBLISH == 'true'
        with:
          name: docker-digest-${{ matrix.arch }}
          path: digests/
  manifest:
    if: github.repository == 'Project-MONAI/MONAILabel' && (inputs.publish || github.event_name == 'schedule')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: docker-digest-*
          merge-multiple: true
          path: digests/
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: projectmonai
          password: ${{ secrets.DOCKER_PW }}
      - name: Publish multi-platform tags
        env:
          IMAGE: projectmonai/monailabel
          TAG: ${{ inputs.tag || 'dev' }}
          LATEST: ${{ inputs.latest }}
        run: |
          digests=()
          for file in digests/*; do digests+=("$IMAGE@sha256:${file##*/}"); done
          tags=(--tag "$IMAGE:$TAG")
          if [[ "$LATEST" == true ]]; then tags+=(--tag "$IMAGE:latest"); fi
          docker buildx imagetools create "${tags[@]}" "${digests[@]}"
