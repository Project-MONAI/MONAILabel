name: Package
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.8'
      - run: uv run --no-project python scripts/build_package.py
      - run: uv run --no-project python scripts/check_packages.py --metadata-only
      - run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error
  install:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.8'
      - uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist/
      - run: uv run --no-project python scripts/check_packages.py --python "$PYTHON_VERSION"
        env:
          PYTHON_VERSION: ${{ matrix.python }}
