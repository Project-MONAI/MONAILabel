name: release
# generating and publishing release package artifacts from the main branch

on:
  workflow_dispatch:
    inputs:
      test_py:
        description: 'Publish package to test PY Repository'
        required: true
        default: 'true'
      main_py:
        description: 'Publish package to main PY Repository'
        required: true
        default: 'false'

jobs:
  packaging:
    if: github.repository == 'Project-MONAI/MONAILabel'
    runs-on: ubuntu-latest
    env:
      MONAI_ZOO_AUTH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: cache weekly timestamp
        id: pip-cache
        run: |
          echo "datew=$(date '+%Y-%V')" >> $GITHUB_OUTPUT
      - name: Cache for pip
        uses: actions/cache@v6
        id: cache
        with:
          path: |
            ~/.cache/pip
            ~/.cache/torch
          key: ${{ runner.os }}-pip-${{ steps.pip-cache.outputs.datew }}
      - name: Install dependencies
        run: |
          # keep the interpreter installed by setup-python; drop the rest of the tool cache to free disk
          find /opt/hostedtoolcache -mindepth 1 -maxdepth 1 ! -name Python -exec rm -rf {} +
          sudo apt-get install openslide-tools -y
          python -m pip install --user --upgrade pip setuptools wheel
          python -m pip install torch torchvision
      - name: Build Package
        run: |
          ./runtests.sh --clean
          BUILD_OHIF=true python setup.py sdist bdist_wheel --build-number $(date +'%Y%m%d%H%M')
          ls -l dist
      - name: Verify Package
        run: |
          tmp_dir=$(mktemp -d)
          cp dist/monailabel* "$tmp_dir"
          rm -r build monailabel*.egg-info

          # install from wheel
          python -m pip install "$tmp_dir"/monailabel*.whl
          python -c 'import monailabel; monailabel.print_config()' 2>&1 | grep -iv "unknown"
          python -c 'import monailabel; print(monailabel.__file__)'

          # install test utilities
          python -m pip install pytest

          # start the monailabel server in the background and run the integration tests
          ./runtests.sh --net

          # cleanup
          python -m pip uninstall -y monailabel
          rm -r "$tmp_dir"
        env:
          shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Check artifacts
        run: |
          rm dist/monai*.tar.gz
          ls -l dist
          wheel=$(ls dist/monailabel-*.whl)

          # a release is built from a tag; anything else gets a local version (0.8.5+40.gabcdef) that PyPI rejects
          case "$wheel" in
            *+*) echo "::error::$wheel is not built from a release tag"; exit 1 ;;
          esac

          # the OHIF build must have produced the viewer that the wheel serves under /ohif
          if ! python -m zipfile -l "$wheel" | grep -q "monailabel/endpoints/static/ohif/index.html"; then
            echo "::error::$wheel does not contain the OHIF viewer (monailabel/endpoints/static/ohif)"
            exit 1
          fi

      - name: Publish distribution to Test
        if: ${{ github.event.inputs.test_py == 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.TEST_PYPI_TOKEN }}
          repository-url: https://test.pypi.org/legacy/

      - name: Publish distribution to PyPI
        if: ${{ github.event.inputs.main_py == 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
