# Hook tools use the same versions as development and CI, pinned in uv.lock.
minimum_pre_commit_version: '4.0.0'
repos:
  - repo: local
    hooks:
      - id: shellcheck
        name: Lint shell scripts (ShellCheck)
        entry: uv run --locked --no-sync shellcheck
        language: system
        types: [shell]
      - id: assistant-skills
        name: Validate assistant skills
        entry: uv run --locked --no-sync python -m monailabel.server.instructions
        language: system
        files: ^packages/server/src/monailabel/server/(instructions\.py|resources/assistant/)
        pass_filenames: false
      - id: golden-prompts
        name: Check documented golden prompts
        entry: uv run --locked --no-sync python examples/render_golden_prompts.py --check
        language: system
        files: ^(README\.md|examples/(prompts/.*\.json|render_golden_prompts\.py))$
        pass_filenames: false
      - id: isort
        name: Sort Python imports (isort)
        entry: uv run --locked --no-sync isort
        language: system
        types_or: [python, pyi]
      - id: ruff
        name: Lint Python (Ruff)
        entry: uv run --locked --no-sync ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: Format Python (Ruff)
        entry: uv run --locked --no-sync ruff format
        language: system
        types_or: [python, pyi]
      - id: check-merge-conflict
        name: Check merge conflicts
        entry: uv run --locked --no-sync check-merge-conflict
        language: system
        types: [text]
      - id: check-toml
        name: Check TOML
        entry: uv run --locked --no-sync check-toml
        language: system
        types: [toml]
      - id: check-yaml
        name: Check YAML
        entry: uv run --locked --no-sync check-yaml
        language: system
        types: [yaml]
      - id: end-of-file-fixer
        name: Fix end of files
        entry: uv run --locked --no-sync end-of-file-fixer
        language: system
        types: [text]
      - id: trailing-whitespace
        name: Remove trailing whitespace
        entry: uv run --locked --no-sync trailing-whitespace-fixer --markdown-linebreak-ext=md
        language: system
        types: [text]
