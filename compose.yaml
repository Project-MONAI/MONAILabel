services:
  monailabel:
    image: ${MONAILABEL_IMAGE:-monailabel:local}
    build: .
    gpus: all
    network_mode: host
    restart: unless-stopped
    environment:
      MONAILABEL_DATA_DIR: ${MONAILABEL_WORKSPACE_DIR:-${PWD}/workspace}
      MONAILABEL_HEALTH_PORT: ${MONAILABEL_PORT:-8000}
      MONAILABEL_DESKTOP_SOCKET_DIR: /tmp/monailabel-sockets
      NV_INFERENCE_API_KEY: ${NV_INFERENCE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      MONAILABEL_ASSISTANT_PROVIDER: ${MONAILABEL_ASSISTANT_PROVIDER:-local}
      MONAILABEL_ASSISTANT_MODEL: ${MONAILABEL_ASSISTANT_MODEL:-}
      MONAILABEL_ASSISTANT_VARIANT: ${MONAILABEL_ASSISTANT_VARIANT:-lightning}
    volumes:
      - type: bind
        source: ${MONAILABEL_WORKSPACE_DIR:-${PWD}/workspace}
        target: ${MONAILABEL_WORKSPACE_DIR:-${PWD}/workspace}
      - /tmp/monailabel-sockets:/tmp/monailabel-sockets
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["--host", "0.0.0.0", "--port", "${MONAILABEL_PORT:-8000}"]
